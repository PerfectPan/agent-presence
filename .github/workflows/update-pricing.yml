name: Update Pricing Snapshot

on:
  workflow_dispatch:
  schedule:
    # LiteLLM pricing changes occasionally; weekly is enough for a local status CLI.
    - cron: '17 2 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm from `packageManager` and the Node.js major in
      # `.node-version`, and runs `pnpm install --frozen-lockfile`. This job
      # skips the store cache.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          require-lockfile: true

      - run: pnpm run update-pricing

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(usage): update LiteLLM pricing snapshot'
          title: 'chore(usage): update LiteLLM pricing snapshot'
          body: |
            Regenerates `src/usage/litellm-pricing.json` from LiteLLM for the
            supported model allowlist in `scripts/update-pricing.mjs`.
          branch: chore/update-pricing-snapshot
          delete-branch: true

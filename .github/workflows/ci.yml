name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm from `packageManager` and the Node.js major in
      # `.node-version`, restores the pnpm store cache, and runs
      # `pnpm install --frozen-lockfile`. Only the build scripts allowed in
      # pnpm-workspace.yaml run.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm run typecheck

      # Type-aware lint (`pnpm lint`, Vite+) also reports TypeScript errors through tsgolint. The
      # docs site's modules import `astro:content`, whose types `astro sync`
      # generates into site/.astro/.
      - run: pnpm -C site run docs:sync

      - run: pnpm lint

      - run: pnpm run build

      - run: pnpm pack --dry-run

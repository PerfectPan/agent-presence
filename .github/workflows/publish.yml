# npm Trusted Publishing is registered against this file name; renaming it requires changing the package's trusted
# publisher on npmjs.com first. The release jobs come from the shared workflow in PerfectPan/gh-repo-checks;
# the Releasing section of CONTRIBUTING.md describes how this repository uses it.
name: Release

on:
  push:
    branches:
      - main
  # Rebuilds the version pull request from the current main, or retries a failed publish.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: PerfectPan/gh-repo-checks/.github/workflows/npm-release.yml@v1
    # The shared workflow narrows these per job; only its publish job can request an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # Packing runs the package's prepack script (tests, typecheck and build), so the gate adds the other CI
      # checks. Lint reads the types that `docs:sync` generates for the docs site.
      check-command: pnpm format:check && pnpm -C site run docs:sync && pnpm lint
      # The private docs site under site/ never reaches npm, so its advisories do not block a package release.
      audit-command: pnpm --filter '!./site' audit --prod --audit-level=high
